<style>
        html, body {

        body {
            display: flex;

        .hero {
            padding: 120px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #0a1116 0%, #04070a 100%);
            flex-grow: 1; /* Allow hero section to grow and take available space */

            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: var(--gradient);
            -webkit-background-clip: text;
            color: transparent;
        }
        .hero p {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .hero .btn {
            display: inline-block;
            padding: 12px 28px;
            margin-top: 20px;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .hero .btn:hover {
            background-color: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }
        footer {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
            border-top: 1px solid rgba(0, 255, 157, 0.15);
            margin-top: auto; /* Push footer to the bottom */

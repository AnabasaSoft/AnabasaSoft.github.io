<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página no encontrada | AnabasaSoft</title>
    <meta name="description" content="La página que buscas no existe o se ha movido. Vuelve al inicio de AnabasaSoft o explora nuestras aplicaciones.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://anabasasoft.github.io/404.html">

    <link rel="icon" href="assets/images/anabasasoft-logo.png" type="image/png">
    <style>
        :root {
            --bg: #04070a;
            --card-bg: #0b0f14;
            --accent: #00ff9d;
            --text: #d5ffe9;
            --highlight: #0affc6;
            --gradient: linear-gradient(135deg, #00ff9d 0%, #00d0ff 100%);
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 157, 0.2);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        header .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        header .logo-container img {
            height: 40px;
        }
        header .brand {
            background: var(--gradient);
            -webkit-background-clip: text;
            color: transparent;
            font-size: 1.8rem;
            margin: 0;
            font-weight: 700;
        }
        nav a {
            margin-left: 20px;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover {
            color: var(--accent);
        }
        .not-found {
            padding: 100px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #0a1116 0%, #04070a 100%);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .not-found h1 {
            font-size: 6rem;
            margin: 0;
            background: var(--gradient);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        .not-found h2 {
            font-size: 1.8rem;
            margin: 10px 0 20px 0;
        }
        .not-found p {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 480px;
        }
        .not-found .links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .not-found .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .not-found .btn:hover {
            background-color: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }
        footer {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
            border-top: 1px solid rgba(0, 255, 157, 0.15);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
                <img src="assets/images/anabasasoft-logo.png" alt="AnabasaSoft Logo">
                <p class="brand">AnabasaSoft</p>
            </a>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="apps.html">Aplicaciones</a>
            <a href="about.html">Nosotros</a>
            <a href="https://github.com/AnabasaSoft" target="_blank">GitHub</a>
        </nav>
    </header>

    <section class="not-found">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>La página que buscas no existe o se ha movido de sitio. Prueba a volver al inicio o a explorar nuestras aplicaciones.</p>
        <div class="links">
            <a href="index.html" class="btn">Volver al Inicio</a>
            <a href="apps.html" class="btn">Ver Aplicaciones</a>
        </div>
    </section>

    <footer>
        © 2025 AnabasaSoft — Code is Law.
    </footer>
</body>
</html>
